name: Build ImageMagick for macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile
          eval "$(/opt/homebrew/bin/brew shellenv)"

      - name: Install Homebrew dependencies
        run: |
          brew install cmake jpeg dylibbundler webp openexr little-cms2 pkg-config glib fontconfig ghostscript freetype gettext libzip libraqm libheif jbigkit pango libraw libwmf djvulibre pango librsvg

      - name: Create symbolic links
        run: |
          sudo mkdir -p /usr/local/lib
          cd /usr/local/lib
          sudo ln -sf /opt/homebrew/lib/libjpeg.dylib .
          sudo ln -sf /opt/homebrew/opt/liblqr/lib/liblqr-1.0.dylib .
          cd /usr/local/
          sudo ln -sf /opt/homebrew/Cellar/jpeg-xl/0.11.1_1/include/jxl .

      - name: Clone ImageMagick
        run: |
          git clone https://github.com/ImageMagick/ImageMagick.git ImageMagick-7.1.1
          cd ImageMagick-7.1.1

      - name: Build ImageMagick
        run: |
          cd ImageMagick-7.1.1
          make distclean || true
          ./configure \
            CC=clang \
            CFLAGS="-O3" \
            CXX=clang++ \
            CXXFLAGS="-std=c++11 -O3 -march=native" \
            LDFLAGS="-L/opt/homebrew/opt/jpeg/lib" \
            CPPFLAGS="-I/opt/homebrew/opt/jpeg/include" \
            --disable-dependency-tracking \
            --without-x \
            --without-magick-plus-plus \
            --disable-shared \
            --enable-static
          make -j 8

      - name: Create Magick.app framework
        run: |
          # Find a simple app to use as template (using Calculator as template)
          cp -R /System/Applications/Calculator.app ./Magick.app

          # Replace the executable
          cp ImageMagick-7.1.1/utilities/magick ./Magick.app/Contents/MacOS/
          rm -f ./Magick.app/Contents/MacOS/Calculator

          # Update Info.plist to reference magick executable
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable magick" ./Magick.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Magick" ./Magick.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.imagemagick.magick" ./Magick.app/Contents/Info.plist

          # Remove irrelevant contents
          rm -rf ./Magick.app/Contents/Resources/*
          rm -rf ./Magick.app/Contents/PlugIns
          rm -rf ./Magick.app/Contents/_CodeSignature

      - name: Bundle libraries manually
        run: |
          # Create libs directory
          mkdir -p ./Magick.app/Contents/libs/

          echo "Manually bundling all dependencies..."

          # Function to copy library and fix paths
          copy_and_fix_lib() {
            local lib_path="$1"
            local lib_name=$(basename "$lib_path")
            local dest="./Magick.app/Contents/libs/$lib_name"

            # Skip if already copied
            if [ -f "$dest" ]; then
              return
            fi

            # Resolve symlinks and copy the actual file
            if [ -L "$lib_path" ]; then
              local real_path=$(readlink "$lib_path")
              if [[ "$real_path" != /* ]]; then
                real_path="$(dirname "$lib_path")/$real_path"
              fi
              lib_path="$real_path"
            fi

            if [ -f "$lib_path" ]; then
              cp "$lib_path" "$dest"
              chmod +w "$dest"
              echo "Copied: $lib_name"
            fi
          }

          # Get all dependencies from the main binary
          echo "Collecting dependencies from magick binary..."
          otool -L ./Magick.app/Contents/MacOS/magick | grep "/opt/homebrew" | awk '{print $1}' | while read lib; do
            copy_and_fix_lib "$lib"
          done

          # Recursively get dependencies of dependencies
          echo "Collecting nested dependencies..."
          for i in {1..5}; do
            echo "Pass $i..."
            for dylib in ./Magick.app/Contents/libs/*.dylib; do
              if [ -f "$dylib" ]; then
                otool -L "$dylib" | grep "/opt/homebrew" | awk '{print $1}' | while read lib; do
                  copy_and_fix_lib "$lib"
                done
              fi
            done
          done

          echo "Fixing library paths in main binary..."
          # Fix paths in main binary
          otool -L ./Magick.app/Contents/MacOS/magick | grep "/opt/homebrew" | awk '{print $1}' | while read lib; do
            lib_name=$(basename "$lib")
            install_name_tool -change "$lib" "@executable_path/../libs/$lib_name" ./Magick.app/Contents/MacOS/magick
            echo "Fixed: $lib -> @executable_path/../libs/$lib_name"
          done

          echo "Fixing library paths in bundled libraries..."
          # Fix paths in all bundled libraries
          for dylib in ./Magick.app/Contents/libs/*.dylib; do
            if [ -f "$dylib" ]; then
              dylib_name=$(basename "$dylib")
              # Fix the library's own ID
              install_name_tool -id "@executable_path/../libs/$dylib_name" "$dylib"

              # Fix references to other libraries
              otool -L "$dylib" | grep "/opt/homebrew" | awk '{print $1}' | while read lib; do
                lib_name=$(basename "$lib")
                if [ -f "./Magick.app/Contents/libs/$lib_name" ]; then
                  install_name_tool -change "$lib" "@executable_path/../libs/$lib_name" "$dylib"
                fi
              done
            fi
          done

          # Count the number of dylib files
          DYLIB_COUNT=$(find ./Magick.app/Contents/libs/ -name "*.dylib" | wc -l)
          echo "Total libraries bundled: $DYLIB_COUNT"

          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "ERROR: No libraries were bundled!"
            exit 1
          fi

          # Verify all dependencies are now internal
          echo "Verifying dependencies..."
          echo "Main binary dependencies:"
          otool -L ./Magick.app/Contents/MacOS/magick

          echo "Checking for remaining external dependencies..."
          EXTERNAL=$(otool -L ./Magick.app/Contents/MacOS/magick | grep -v "@executable_path" | grep -v "/usr/lib" | grep -v "/System" | grep -v ":" | wc -l)
          if [ "$EXTERNAL" -gt 0 ]; then
            echo "WARNING: Found $EXTERNAL external dependencies:"
            otool -L ./Magick.app/Contents/MacOS/magick | grep -v "@executable_path" | grep -v "/usr/lib" | grep -v "/System"
          else
            echo "SUCCESS: All dependencies are bundled!"
          fi

          # List bundled libraries
          echo "Bundled libraries:"
          ls -lh ./Magick.app/Contents/libs/

      - name: Code sign the application (ad-hoc)
        run: |
          # Ad-hoc signing to avoid Gatekeeper warnings
          codesign --force --deep --sign - ./Magick.app

      - name: Create distributable archive
        run: |
          # Verify libs were copied
          echo "Contents of libs directory:"
          ls -lh ./Magick.app/Contents/libs/ || echo "libs directory is empty or missing!"

          # Count the number of dylib files
          DYLIB_COUNT=$(find ./Magick.app/Contents/libs/ -name "*.dylib" | wc -l)
          echo "Number of dylib files: $DYLIB_COUNT"

          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "ERROR: No libraries were bundled!"
            exit 1
          fi

          # Create a zip of the app
          zip -r magick-macos.zip Magick.app

          # Also create a standalone binary archive
          mkdir -p magick-standalone
          cp ImageMagick-7.1.1/utilities/magick magick-standalone/
          cp -R Magick.app/Contents/libs magick-standalone/ || echo "Warning: libs directory not copied"
          tar -czf magick-standalone.tar.gz magick-standalone

      - name: Get version info
        id: version
        run: |
          cd ImageMagick-7.1.1
          VERSION=$(./utilities/magick --version | head -n1 | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ImageMagick ${{ steps.version.outputs.version }} for macOS
          draft: false
          prerelease: false

      - name: Upload Magick.app to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./magick-macos.zip
          asset_name: magick-macos.zip
          asset_content_type: application/zip

      - name: Upload standalone binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./magick-standalone.tar.gz
          asset_name: magick-standalone.tar.gz
          asset_content_type: application/gzip
